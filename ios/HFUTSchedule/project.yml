name: HFUTSchedule
options:
  bundleIdPrefix: com.xiaozhangwangxue
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: K6T9P3LS8V
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  HFUTSchedule:
    type: application
    platform: iOS
    sources:
      - path: HFUTSchedule
      - path: Shared
    dependencies:
      - target: HFUTScheduleWidget
        embed: true
    settings:
      base:
        INFOPLIST_FILE: HFUTSchedule/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhangwangxue.hfutschedule.ios
        PRODUCT_NAME: HFUTSchedule
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_ENTITLEMENTS: HFUTSchedule/HFUTSchedule.entitlements
  HFUTScheduleWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HFUTScheduleWidget
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: HFUTScheduleWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhangwangxue.hfutschedule.ios.widget
        PRODUCT_NAME: HFUTScheduleWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGNING_ALLOWED: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: HFUTScheduleWidget/HFUTScheduleWidget.entitlements
  HFUTScheduleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HFUTScheduleTests
    dependencies:
      - target: HFUTSchedule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhangwangxue.hfutschedule.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K6T9P3LS8V
schemes:
  HFUTSchedule:
    build:
      targets:
        HFUTSchedule: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - HFUTScheduleTests
