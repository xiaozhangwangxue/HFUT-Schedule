name: HFUTSchedule
options:
  bundleIdPrefix: com.xiaozhangwangxue
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: TZXUU25NQA
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  HFUTSchedule:
    type: application
    platform: iOS
    sources:
      - path: HFUTSchedule
    settings:
      base:
        INFOPLIST_FILE: HFUTSchedule/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhangwangxue.hfutschedule.ios
        PRODUCT_NAME: HFUTSchedule
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGNING_ALLOWED: YES
  HFUTScheduleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HFUTScheduleTests
    dependencies:
      - target: HFUTSchedule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhangwangxue.hfutschedule.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  HFUTSchedule:
    build:
      targets:
        HFUTSchedule: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - HFUTScheduleTests
